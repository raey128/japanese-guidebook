name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: guidebook
          POSTGRES_PASSWORD: guidebook
          POSTGRES_DB: guidebook_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guidebook" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://guidebook:guidebook@localhost:5432/guidebook_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # No lockfile is committed yet; switch to `pnpm install --frozen-lockfile` once it is.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: guidebook
          POSTGRES_PASSWORD: guidebook
          POSTGRES_DB: guidebook
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guidebook" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      GUIDEBOOK_DATABASE_URL: postgresql+asyncpg://guidebook:guidebook@localhost:5432/guidebook
      # e2e never calls the public geocoder.
      GUIDEBOOK_GEOCODER_URL: http://127.0.0.1:9/disabled
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start API
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync
          uv run alembic upgrade head
          uv run python -m app.cli seed-locations
          uv run python -m app.cli seed-places
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          # An admin for the map-first e2e (manual add → approval, N5.6).
          curl -sf -X POST localhost:8000/api/auth/sign-in -H 'content-type: application/json' \
            -d '{"username":"e2e_admin","create":true}' > /dev/null
          uv run python -m app.cli make-admin e2e_admin
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install --with-deps
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
