services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: guidebook
      POSTGRES_PASSWORD: guidebook
      POSTGRES_DB: guidebook
      # UTF-8 with a non-C locale so pg_trgm builds trigrams for CJK names.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init-test-db.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidebook -d guidebook"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      GUIDEBOOK_DATABASE_URL: postgresql+asyncpg://guidebook:guidebook@db:5432/guidebook
      TEST_DATABASE_URL: postgresql+asyncpg://guidebook:guidebook@db:5432/guidebook_test
      GUIDEBOOK_DUMP_DIR: /app/dumps
    ports: ["8000:8000"]
    volumes:
      - ./dumps:/app/dumps
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ./frontend }
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]

  cron:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["supercronic", "/app/infra/cron/crontab"]
    environment:
      GUIDEBOOK_DATABASE_URL: postgresql+asyncpg://guidebook:guidebook@db:5432/guidebook
      GUIDEBOOK_DUMP_DIR: /app/dumps
    volumes:
      - ./dumps:/app/dumps
      - ./infra/cron:/app/infra/cron:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
